name: Publish tested 1.4.1 release

on:
  push:
    branches: [main]
    paths: ['releases/1.4.1/CHANGELOG.md']

permissions:
  contents: write

concurrency:
  group: release-1.4.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build and publish tested wheel and installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.1'
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          & python -B scripts/release/build_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows distribution build failed.' }
          $wheel = "releases/$version/zemax_standalone_mcp-$version-py3-none-any.whl"
          $bundle = "releases/$version/zemax-standalone-mcp-$version-windows-x64.zip"
          foreach ($path in @($wheel, $bundle)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release input: $path" }
          }
          gh release create "v$version" $wheel $bundle --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "v$version — OpticStudio 2026 R1" --notes-file releases/1.4.1/CHANGELOG.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
