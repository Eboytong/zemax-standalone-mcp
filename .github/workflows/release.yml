name: Publish tested 1.4.1 release

on:
  push:
    branches: [main]
    paths:
      - 'releases/1.4.1/*.whl'
      - 'releases/1.4.1/*.zip'

permissions:
  contents: write

concurrency:
  group: release-1.4.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish committed wheel and installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.1'
          $wheel = "releases/$version/zemax_standalone_mcp-$version-py3-none-any.whl"
          $bundle = "releases/$version/zemax-standalone-mcp-$version-windows-x64.zip"
          $notes = "releases/$version/CHANGELOG.md"
          foreach ($path in @($wheel, $bundle, $notes)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release input: $path" }
          }
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create "v$version" $wheel $bundle --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "v$version — OpticStudio 2026 R1" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
